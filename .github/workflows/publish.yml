name: Publish to PyPI

# Ausgelöst vom Tag-Push, nicht vom Release.
#
# Vorher hing dieser Workflow an `release: published`. Legt man das Release im
# Browser an, entsteht der Tag mit — beide Ereignisse feuern, alles lief. Kommt
# der Tag dagegen per `git push`, erzeugt release.yml das Release mit
# GITHUB_TOKEN, und ein von GITHUB_TOKEN erzeugtes Ereignis löst keine weiteren
# Workflows aus. Der Publish blieb dann still aus: 2.0.2 ist deshalb nie auf
# PyPI gelandet, 3.0.0 zunächst auch nicht.
#
# Der Tag-Push ist bei beiden Wegen vorhanden — auch die UI legt den Tag an.
# Ein zusätzlicher `release:`-Trigger würde bei diesem Weg einen zweiten Lauf
# starten und am schon hochgeladenen Artefakt scheitern.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, der veröffentlicht werden soll (z. B. v3.0.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Bei workflow_dispatch steht der Tag im Input, beim Tag-Push in ref_name.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write  # Pflicht für Trusted Publisher

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ein Tag auf dem falschen Commit fällt sonst erst auf PyPI auf, und dort
      # ist eine Version nicht wiederverwendbar.
      - name: Tag und Paketversion vergleichen
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Tag: $TAG_VERSION – pyproject: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG zeigt auf einen Commit mit Version $PKG_VERSION."
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bakom-mcp/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Sync server.json version to the release tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
